# Deploy to GitHub Pages
#
# This workflow publishes the PRE-BUILT app in `standalone/app/` directly to
# GitHub Pages. No Node/npm build step is required, so the repository does not
# need the `src/` source folder for the live site to work.
#
# If you later add the `src/` source and want Pages to build from source
# instead, replace the "Upload artifact" path below with './dist' and add
# "npm ci" + "npm run build" steps before it.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload pre-built app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The already-built, self-contained app committed in the repo.
          path: './standalone/app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
